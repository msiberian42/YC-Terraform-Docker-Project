#cloud-config

package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-v2
  - curl
  - python3
  - openssh-server

bootcmd:
  - mkdir -p /opt/project1/haproxy/reverse
  - mkdir -p /opt/project1/nginx/ingress

write_files:

  # Docker Compose
  - path: /opt/project1/compose.yaml
    permissions: "0644"
    owner: root:root
    content: |
      services:

        reverse-proxy:
          image: haproxy:2.4
          restart: always
          networks:
            backend: {}
          ports:
            - "127.0.0.1:8080:8080"
          volumes:
            - /opt/project1/haproxy/reverse/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

        web:
          image: ${web_image}
          restart: always
          networks:
            backend:
              ipv4_address: 172.20.0.5
          environment:
            DB_HOST: "${db_host}"
            DB_PORT: "3306"
            DB_NAME: "${db_name}"
            DB_USER: "${db_user}"
            DB_PASSWORD: $${DB_PASSWORD}

        ingress-proxy:
          image: nginx:latest
          restart: always
          network_mode: host
          volumes:
            - /opt/project1/nginx/ingress/default.conf:/etc/nginx/conf.d/default.conf:ro
            - /opt/project1/nginx/ingress/nginx.conf:/etc/nginx/nginx.conf:ro

      networks:
        backend:
          name: backend
          driver: bridge
          ipam:
            config:
              - subnet: 172.20.0.0/24

  # HAProxy
  - path: /opt/project1/haproxy/reverse/haproxy.cfg
    permissions: "0644"
    owner: root:root
    content: |
${haproxy_cfg}

  # NGINX
  - path: /opt/project1/nginx/ingress/nginx.conf
    permissions: "0644"
    owner: root:root
    content: |
${nginx_conf}

  - path: /opt/project1/nginx/ingress/default.conf
    permissions: "0644"
    owner: root:root
    content: |
${nginx_default}

runcmd:

  # SSH
  - systemctl unmask ssh.service
  - systemctl enable ssh.service
  - systemctl restart ssh.service
  - systemctl is-active --quiet ssh.service

  - sshd -t
  - ss -lntp | grep ':22'

  # Docker
  - systemctl enable docker
  - systemctl start docker

  # ubuntu -> docker
  - usermod -aG docker ubuntu

  # Получаем пароль из Lockbox и запускаем приложение
  - |
      set -eu

      LOCKBOX_SECRET_ID="${db_lockbox_secret_id}"

      IAM_TOKEN="$(
        curl -fsS \
          --header Metadata-Flavor:Google \
          http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token \
          | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])'
      )"

      DB_PASSWORD="$(
        curl -fsS \
          --header "Authorization: Bearer $${IAM_TOKEN}" \
          "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$${LOCKBOX_SECRET_ID}/payload" \
          | python3 -c '
      import json
      import sys

      payload = json.load(sys.stdin)

      for entry in payload["entries"]:
          if entry["key"] == "password":
              print(entry["textValue"])
              break
      '
      )"

      test -n "$${DB_PASSWORD}"

      echo "$${IAM_TOKEN}" | docker login \
        --username iam \
        --password-stdin \
        cr.yandex

      export WEB_IMAGE="${web_image}"
      export DB_HOST="${db_host}"
      export DB_PORT="3306"
      export DB_NAME="${db_name}"
      export DB_USER="${db_user}"
      export DB_PASSWORD

      cd /opt/project1

      docker compose pull
      docker compose up -d
      docker compose ps