#cloud-config

package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-v2
  

runcmd:
  # Запускаем Docker и добавляем в автозапуск
  - systemctl enable docker
  - systemctl start docker

  # Разрешаем пользователю ubuntu работать с Docker без sudo
  - usermod -aG docker ubuntu

  # Проверяем установку
  - docker --version
  - docker compose version