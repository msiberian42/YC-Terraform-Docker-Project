#cloud-config

package_update: true
package_upgrade: false

datasource:
  Ec2:
    strict_id: false
  secrets:
    project1_db: ${db_lockbox_secret_id}

packages:
  - docker.io
  - docker-compose-v2
  - curl
  - openssh-server

# Создаём каталоги
bootcmd:
  - mkdir -p /opt/project1/haproxy/reverse
  - mkdir -p /opt/project1/nginx/ingress

write_files:

  # Docker compose
  - path: /opt/project1/compose.yaml
    permissions: "0644"
    owner: root:root
    content: |
      services:

        reverse-proxy:
          image: haproxy:2.4
          restart: always
          networks:
            backend: {}
          ports:
            - "127.0.0.1:8080:8080"
          volumes:
            - /opt/project1/haproxy/reverse/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

        web:
          image: ${web_image}
          restart: always
          networks:
            backend:
              ipv4_address: 172.20.0.5
          environment:
            DB_HOST: ${db_host}
            DB_PORT: 3306
            DB_NAME: ${db_name}
            DB_USER: ${db_user}
            DB_PASSWORD: $${DB_PASSWORD}

        ingress-proxy:
          image: nginx:latest
          restart: always
          network_mode: host
          volumes:
            - /opt/project1/nginx/ingress/default.conf:/etc/nginx/conf.d/default.conf:ro
            - /opt/project1/nginx/ingress/nginx.conf:/etc/nginx/nginx.conf:ro

      networks:
        backend:
          name: backend
          driver: bridge
          ipam:
            config:
              - subnet: 172.20.0.0/24

  # HAProxy
  - path: /opt/project1/haproxy/reverse/haproxy.cfg
    permissions: "0644"
    owner: root:root
    content: |
      ${haproxy_cfg}

  # Nginx
  - path: /opt/project1/nginx/ingress/nginx.conf
    permissions: "0644"
    owner: root:root
    content: |
      ${nginx_conf}

  - path: /opt/project1/nginx/ingress/default.conf
    permissions: "0644"
    owner: root:root
    content: |
      ${nginx_default}

  # Enviroment
  - path: /opt/project1/.env
    permissions: "0600"
    owner: root:root
    content: |
      WEB_IMAGE=${web_image}
      DB_HOST=${db_host}
      DB_PORT=3306
      DB_NAME=${db_name}
      DB_USER=${db_user}
      DB_PASSWORD=${db_password}

runcmd:
  # Запускаем SSH
  - systemctl enable ssh
  - systemctl start ssh

  # Запускаем Docker
  - systemctl enable docker
  - systemctl start docker

  # Добавляем ubuntu в группу docker
  - usermod -aG docker ubuntu

  # Создаём директории приложения
  - mkdir -p /opt/project1

  # Авторизация в Yandex Container Registry
  - |
      TOKEN=$(curl --fail --silent \
        --header Metadata-Flavor:Google \
        http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token \
        | sed 's/.*"access_token":"\([^"]*\)".*/\1/')

      echo "$TOKEN" | docker login \
        --username iam \
        --password-stdin \
        cr.yandex

      DB_PASSWORD="$(
        curl -fsS \
          --header "Authorization: Bearer ${IAM_TOKEN}" \
          "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${LOCKBOX_SECRET_ID}/payload" \
        | python3 -c '
      import json
      import sys

      payload = json.load(sys.stdin)

      for entry in payload["entries"]:
          if entry["key"] == "password":
              print(entry["textValue"])
              break
      '
      )"

      test -n "$DB_PASSWORD"

      echo "$IAM_TOKEN" | docker login \
        --username iam \
        --password-stdin \
        cr.yandex

      export WEB_IMAGE="${web_image}"
      export DB_HOST="${db_host}"
      export DB_PORT="3306"
      export DB_NAME="${db_name}"
      export DB_USER="${db_user}"
      export DB_PASSWORD

  # Переходим в каталог приложения
  - cd /opt/project1

  # Скачиваем образы
  - docker compose pull

  # Запускаем приложение
  - docker compose up -d

  # Показываем состояние контейнеров
  - docker compose ps