services:
  reverse-proxy:
    image: haproxy:2.4
    restart: always
    networks:
        backend: {}
    ports:
    - "127.0.0.1:8080:8080"
    volumes:
    - ./haproxy/reverse/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:rw

  web:
    image: $${WEB_IMAGE}
    restart: always
    networks:
      backend:
        ipv4_address: 172.20.0.5
    environment:
      DB_HOST: $${DB_HOST}
      DB_PORT: $${DB_PORT}
      DB_NAME: $${DB_NAME}
      DB_USER: $${DB_USER}
      DB_PASSWORD: $${DB_PASSWORD}

  ingress-proxy:
      image: nginx:latest
      restart: always
      network_mode: host
      volumes:
        - /opt/project1/nginx/ingress/default.conf:/etc/nginx/conf.d/default.conf:ro
        - /opt/project1/nginx/ingress/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  backend:
    name: backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24